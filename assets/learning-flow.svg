<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Siksha Sahayak Learning Experience</title>
  <desc id="desc">Animated learning loop from Learn to Study Material, Practice, Quiz, Assessment and Improvement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="50%" stop-color="#0b1630"/>
      <stop offset="100%" stop-color="#100b2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00e5ff"/>
    </marker>
    <style>
      .title { font: 800 38px Inter,Segoe UI,Arial,sans-serif; fill: #fff; }
      .sub { font: 600 17px Inter,Segoe UI,Arial,sans-serif; fill: #9bb4d2; }
      .label { font: 800 20px Inter,Segoe UI,Arial,sans-serif; fill: #fff; }
      .small { font: 600 14px Inter,Segoe UI,Arial,sans-serif; fill: #9bb4d2; }
      .node { fill: #0d1a30; stroke: #2b466c; stroke-width: 2; }
      .nodeText { font: 800 18px Inter,Segoe UI,Arial,sans-serif; fill: #fff; }
      .icon { font: 700 30px Arial,sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="160" cy="130" r="130" fill="#00e5ff" opacity=".07" filter="url(#soft)"/>
  <circle cx="1010" cy="600" r="180" fill="#7c4dff" opacity=".08" filter="url(#soft)"/>

  <text x="600" y="65" text-anchor="middle" class="title">🔄 LEARNING EXPERIENCE</text>
  <text x="600" y="96" text-anchor="middle" class="sub">A continuous cycle of learning, practice, assessment and improvement</text>

  <!-- Animated flow paths -->
  <g fill="none" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#glow)">
    <path d="M600 190 L600 255">
      <animate attributeName="stroke-dasharray" values="0,220;220,0" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M600 345 L600 410">
      <animate attributeName="stroke-dasharray" values="0,220;220,0" dur="1.7s" begin=".45s" repeatCount="indefinite"/>
    </path>
    <path d="M600 500 L600 565">
      <animate attributeName="stroke-dasharray" values="0,220;220,0" dur="1.7s" begin=".9s" repeatCount="indefinite"/>
    </path>
    <path d="M600 655 C600 705 470 720 350 720 C160 720 105 610 105 510"/>
  </g>

  <!-- Return loop -->
  <path d="M105 510 C105 325 235 180 405 180 H510" fill="none" stroke="#7c4dff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" opacity=".9">
    <animate attributeName="stroke-dasharray" values="10 20;20 10;10 20" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="185" y="715" class="small" fill="#b9a8ff">↺ Continuous improvement loop</text>

  <!-- Nodes -->
  <g>
    <rect x="430" y="125" width="340" height="66" rx="33" class="node"/>
    <circle cx="464" cy="158" r="19" fill="#00e5ff" opacity=".2"><animate attributeName="r" values="19;27;19" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="464" y="168" text-anchor="middle" class="icon">📚</text>
    <text x="505" y="155" class="label">LEARN</text>
    <text x="505" y="177" class="small">Understand concepts</text>
  </g>

  <g>
    <rect x="430" y="280" width="340" height="66" rx="33" class="node"/>
    <circle cx="464" cy="313" r="19" fill="#00e5ff" opacity=".2"><animate attributeName="r" values="19;27;19" dur="1.6s" begin=".4s" repeatCount="indefinite"/></circle>
    <text x="464" y="323" text-anchor="middle" class="icon">📖</text>
    <text x="505" y="310" class="label">STUDY MATERIAL</text>
    <text x="505" y="332" class="small">Learn from structured resources</text>
  </g>

  <g>
    <rect x="430" y="435" width="340" height="66" rx="33" class="node"/>
    <circle cx="464" cy="468" r="19" fill="#00e5ff" opacity=".2"><animate attributeName="r" values="19;27;19" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
    <text x="464" y="478" text-anchor="middle" class="icon">❓</text>
    <text x="505" y="465" class="label">PRACTICE</text>
    <text x="505" y="487" class="small">Solve topic-wise questions</text>
  </g>

  <g>
    <rect x="430" y="590" width="340" height="66" rx="33" class="node"/>
    <circle cx="464" cy="623" r="19" fill="#7c4dff" opacity=".24"><animate attributeName="r" values="19;28;19" dur="1.7s" begin="1.2s" repeatCount="indefinite"/></circle>
    <text x="464" y="633" text-anchor="middle" class="icon">🧠</text>
    <text x="505" y="620" class="label">QUIZ → ASSESSMENT</text>
    <text x="505" y="642" class="small">Measure knowledge and performance</text>
  </g>

  <g opacity="0">
    <rect x="885" y="290" width="230" height="150" rx="24" fill="#0d1a30" stroke="#7c4dff" stroke-width="2"/>
    <text x="1000" y="340" text-anchor="middle" class="icon">📊</text>
    <text x="1000" y="375" text-anchor="middle" class="nodeText">ASSESSMENT</text>
    <text x="1000" y="402" text-anchor="middle" class="small">Analyze results</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.75;1" dur="5s" repeatCount="indefinite"/>
  </g>

  <g opacity="0">
    <rect x="885" y="475" width="230" height="150" rx="24" fill="#0d1a30" stroke="#00e5ff" stroke-width="2"/>
    <text x="1000" y="525" text-anchor="middle" class="icon">🎯</text>
    <text x="1000" y="560" text-anchor="middle" class="nodeText">IMPROVEMENT</text>
    <text x="1000" y="587" text-anchor="middle" class="small">Identify gaps and grow</text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.75;1" dur="5s" begin="2.5s" repeatCount="indefinite"/>
  </g>

  <text x="600" y="744" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#5e789b">SIKSHA SAHAYAK • LEARN → PRACTICE → ASSESS → IMPROVE</text>
</svg>
