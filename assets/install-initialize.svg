<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="430" viewBox="0 0 1050 430"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#00C6FF"/><stop offset="1" stop-color="#7F00FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1050" height="430" rx="28" fill="#07111f" stroke="#17304d" stroke-width="2"/><text x="525" y="42" text-anchor="middle" fill="white" font-family="Arial" font-size="25" font-weight="700">📦 INSTALL &amp; INITIALIZE</text><text x="525" y="68" text-anchor="middle" fill="#8fb3d9" font-family="Arial" font-size="13">Prepare database, admin access and curriculum</text><g font-family="Arial" text-anchor="middle"><rect x="95" y="105" width="210" height="70" rx="17" fill="#0d2035" stroke="#00C6FF" stroke-width="2" filter="url(#glow)"/><text x="200" y="134" fill="white" font-size="16" font-weight="700">📦 DEPENDENCIES</text><text x="200" y="157" fill="#8fb3d9" font-size="12">pip install -r requirements.txt</text><rect x="420" y="105" width="210" height="70" rx="17" fill="#0d2035" stroke="#7F00FF" stroke-width="2" filter="url(#glow)"/><text x="525" y="134" fill="white" font-size="16" font-weight="700">🗄️ MIGRATE</text><text x="525" y="157" fill="#8fb3d9" font-size="12">python manage.py migrate</text><rect x="745" y="105" width="210" height="70" rx="17" fill="#0d2035" stroke="#00C6FF" stroke-width="2" filter="url(#glow)"/><text x="850" y="134" fill="white" font-size="16" font-weight="700">🛡️ SUPERUSER</text><text x="850" y="157" fill="#8fb3d9" font-size="12">create admin account</text><path d="M305 140H420 M630 140H745" stroke="#00C6FF" stroke-width="3" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1s" repeatCount="indefinite"/></path><path d="M850 175V225H525" fill="none" stroke="#7F00FF" stroke-width="3" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1s" repeatCount="indefinite"/></path><rect x="315" y="225" width="420" height="70" rx="17" fill="#101d35" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/><text x="525" y="254" fill="white" font-size="16" font-weight="700">🌱 SEED CURRICULUM</text><text x="525" y="277" fill="#8fb3d9" font-size="12">python manage.py seed_curriculum</text><path d="M525 295V335" stroke="#00C6FF" stroke-width="3" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1s" repeatCount="indefinite"/></path><rect x="315" y="335" width="420" height="55" rx="16" fill="#101d35" stroke="#7F00FF" stroke-width="2"/><text x="525" y="369" fill="white" font-size="17" font-weight="700">🚀 RUN DJANGO SERVER</text></g><circle r="6" fill="white" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M305 140H420 M630 140H745 M850 175V225H525 M525 295V335"/></circle></svg>