<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="45%" stop-color="#071f3d"/>
      <stop offset="100%" stop-color="#180b3b"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#00d9ff" stop-opacity=".55"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/><feOffset dy="4"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="170" cy="70" r="130" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cx" values="170;1030;170" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="250" r="150" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cy" values="250;70;250" dur="9s" repeatCount="indefinite"/></circle>
  <g fill="#7ee7ff" opacity=".75">
    <circle cx="90" cy="55" r="2"/><circle cx="270" cy="245" r="2"/><circle cx="410" cy="75" r="1.5"/><circle cx="760" cy="55" r="2"/><circle cx="930" cy="110" r="1.5"/><circle cx="1100" cy="210" r="2"/><circle cx="600" cy="260" r="1.5"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="118" font-size="22" font-weight="700" fill="#75e6ff" letter-spacing="6">SMART DIGITAL LEARNING</text>
    <text x="600" y="182" font-size="54" font-weight="800" fill="#ffffff">SIKSHA SAHAYAK</text>
    <text x="600" y="225" font-size="19" fill="#c9d7ff">Learn  •  Practice  •  Assess  •  Improve</text>
  </g>
  <path d="M250 270 H950" stroke="#00d9ff" stroke-opacity=".35" stroke-width="2">
    <animate attributeName="stroke-dasharray" values="0 700;350 350;700 0;0 700" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
