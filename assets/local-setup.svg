<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#00C6FF"/><stop offset="1" stop-color="#7F00FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="430" rx="28" fill="#07111f" stroke="#17304d" stroke-width="2"/><text x="550" y="42" text-anchor="middle" fill="white" font-family="Arial" font-size="25" font-weight="700">⚙️ LOCAL SETUP</text><text x="550" y="68" text-anchor="middle" fill="#8fb3d9" font-family="Arial" font-size="13">From repository clone to running Django server</text><g font-family="Arial" text-anchor="middle"><g filter="url(#glow)"><rect x="55" y="105" width="215" height="75" rx="18" fill="#0d2035" stroke="url(#g)" stroke-width="2"/><text x="162" y="135" fill="white" font-size="17" font-weight="700">1️⃣ CLONE</text><text x="162" y="158" fill="#8fb3d9" font-size="12">git clone SSNC</text></g><g filter="url(#glow)"><rect x="315" y="105" width="215" height="75" rx="18" fill="#0d2035" stroke="url(#g)" stroke-width="2"/><text x="422" y="135" fill="white" font-size="17" font-weight="700">2️⃣ ENVIRONMENT</text><text x="422" y="158" fill="#8fb3d9" font-size="12">python -m venv .venv</text></g><g filter="url(#glow)"><rect x="575" y="105" width="215" height="75" rx="18" fill="#0d2035" stroke="url(#g)" stroke-width="2"/><text x="682" y="135" fill="white" font-size="17" font-weight="700">3️⃣ INSTALL</text><text x="682" y="158" fill="#8fb3d9" font-size="12">pip install -r requirements</text></g><g filter="url(#glow)"><rect x="835" y="105" width="210" height="75" rx="18" fill="#0d2035" stroke="url(#g)" stroke-width="2"/><text x="940" y="135" fill="white" font-size="17" font-weight="700">4️⃣ INITIALIZE</text><text x="940" y="158" fill="#8fb3d9" font-size="12">migrate + superuser</text></g><path d="M270 142H315 M530 142H575 M790 142H835" stroke="#00C6FF" stroke-width="3" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1s" repeatCount="indefinite"/></path><path d="M940 180V235H550" fill="none" stroke="#7F00FF" stroke-width="3" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1s" repeatCount="indefinite"/></path><rect x="335" y="235" width="430" height="72" rx="18" fill="#101d35" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/><text x="550" y="264" fill="white" font-size="17" font-weight="700">🌱 SEED CURRICULUM</text><text x="550" y="287" fill="#8fb3d9" font-size="12">python manage.py seed_curriculum</text><path d="M550 307V345" stroke="#00C6FF" stroke-width="3" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1s" repeatCount="indefinite"/></path><rect x="335" y="345" width="430" height="55" rx="16" fill="#101d35" stroke="#7F00FF" stroke-width="2"/><text x="550" y="379" fill="white" font-size="17" font-weight="700">🚀 python manage.py runserver</text></g><circle r="6" fill="white" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M270 142H315 M530 142H575 M790 142H835 M940 180V235H550 M550 307V345"/></circle></svg>