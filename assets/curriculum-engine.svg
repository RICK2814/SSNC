  <path class="flow" d="M390 316 L275 316" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur="0.9s" repeatCount="indefinite"/></path>
  <path class="flow" d="M710 316 L825 316" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur="0.9s" repeatCount="indefinite"/></path>

  <g filter="url(#glow)"><rect x="40" y="270" width="235" height="92" rx="20" fill="#0b1a2d" stroke="#00C6FF" stroke-width="2"/><text x="157" y="306" class="title" font-size="16">📖 STUDY MATERIAL</text><text x="157" y="331" class="sub" font-size="12">Advanced topic resources</text><text x="157" y="350" class="sub" font-size="11">LEARN</text></g>
  <g filter="url(#glow)"><rect x="825" y="270" width="235" height="92" rx="20" fill="#0b1a2d" stroke="#8A2BE2" stroke-width="2"/><text x="942" y="306" class="title" font-size="16">❓ QUESTION BANK</text><text x="942" y="331" class="sub" font-size="12">Important questions</text><text x="942" y="350" class="sub" font-size="11">PRACTICE</text></g>

