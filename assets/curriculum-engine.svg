<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b16"/><stop offset="0.5" stop-color="#0b1830"/><stop offset="1" stop-color="#120a27"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#00C6FF"/><stop offset="1" stop-color="#8A2BE2"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#00C6FF"/></marker>
  <style>
    .node{fill:#0b1a2d;stroke:url(#line);stroke-width:2}
    .title{fill:#fff;font-family:Arial,sans-serif;font-weight:700}
    .sub{fill:#8fb3d9;font-family:Arial,sans-serif}
    .flow{fill:none;stroke:url(#line);stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1100" height="560" rx="30" fill="url(#bg)" stroke="#203c61" stroke-width="2"/>
<circle cx="130" cy="100" r="75" fill="#00C6FF" opacity=".08" filter="url(#soft)"/>
<circle cx="970" cy="420" r="90" fill="#8A2BE2" opacity=".08" filter="url(#soft)"/>
