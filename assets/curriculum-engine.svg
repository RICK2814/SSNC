<circle r="6" fill="#fff" filter="url(#glow)"><animateMotion dur="4.5s" repeatCount="indefinite" path="M550 157 L550 188 M550 252 L550 283 M390 316 L275 316 M710 316 L825 316 M550 347 L550 395 M750 434 C850 434 850 500 690 500 L410 500 C250 500 250 420 350 420"/></circle>
